setting: Autogarage
time_limit_minutes: 10
elements: task, sequence flow, start and end event
skills: linear process, verb-object labels, events named as states
title:
  de: Reifenwechsel in der Garage
  en: Tyre change at a garage
learning_goal:
  de: Einen linearen Ablauf mit Start- und Endereignis modellieren; Aktivitäten als Objekt und Verb benennen.
  en: Model a linear process with start and end event; name activities as object and verb.
text:
  de: 'Eine Autogarage wechselt im Herbst die Sommerräder ihrer Kundschaft gegen Winterräder.

    Der Ablauf beginnt, wenn eine Kundin mit ihrem Auto zum vereinbarten Termin eintrifft.

    Die Kundendienstberaterin nimmt das Auto entgegen. Danach montiert ein Mechaniker die Winterräder

    und prüft anschliessend den Reifendruck. Dann lagert er die Sommerräder im Reifenhotel ein.

    Zum Schluss erstellt die Kundendienstberaterin die Rechnung und übergibt das Auto der Kundin.

    Damit ist der Reifenwechsel abgeschlossen. Modellieren Sie den Ablauf.'
  en: 'A garage replaces its customers'' summer wheels with winter wheels in autumn.

    The process starts when a customer arrives with her car for the agreed appointment.

    The service advisor takes over the car. A mechanic then fits the winter wheels and checks the

    tyre pressure. After that he puts the summer wheels into wheel storage.

    Finally the service advisor creates the invoice and hands the car back to the customer.

    This completes the tyre change. Model the process.'
expected_mistakes:
- de: Aktivitäten nur mit einem Substantiv benannt (z. B. "Rechnung").
  en: Activities named with a noun only (e.g. "Invoice").
- de: Endereignis fehlt oder ist als Tätigkeit benannt.
  en: End event missing or named as an activity.
- de: Rollen (Beraterin, Mechaniker) als Aktivitäten modelliert.
  en: Roles (advisor, mechanic) modelled as activities.
