id: T6-B
topic: 6
level: basic
slot: B
core: true
sector: health
setting: Medizinisches Labor
time_limit_minutes: 10
elements: error end event, error boundary event
skills: handle a failure inside a subprocess
title:
  de: Laborprobe analysieren
  en: Analysing a laboratory sample
learning_goal:
  de: Einen Fehler im Teilprozess mit einem Fehler-Endereignis auslösen und am Rand des Teilprozesses
    abfangen.
  en: Throw an error inside a subprocess with an error end event and catch it on the subprocess boundary.
text:
  de: 'Ein medizinisches Labor analysiert Blutproben von Arztpraxen. Trifft eine Probe ein, wird sie im

    Teilprozess "Probe analysieren" bearbeitet: Eine Laborantin bereitet die Probe vor und prüft, ob sie

    verwertbar ist. Ist sie verwertbar, führt sie die Analyse durch. Ist sie nicht verwertbar (zum Beispiel

    geronnen), bricht die Analyse mit dem Fehler "Probe unbrauchbar" ab. In diesem Fall fordert das Labor
    bei

    der Arztpraxis eine neue Probe an. Nach einer erfolgreichen Analyse gibt eine Ärztin den Befund frei.

    Modellieren Sie den Ablauf mit einem aufgeklappten Teilprozess.'
  en: 'A medical laboratory analyses blood samples from doctors'' practices. When a sample arrives, it
    is

    handled in the subprocess "Analyse sample": a lab technician prepares the sample and checks whether
    it is

    usable. If it is usable, she carries out the analysis. If it is not usable (for example clotted),
    the analysis

    stops with the error "Sample unusable". In that case the laboratory requests a new sample from the
    practice.

    After a successful analysis a doctor releases the findings.

    Model the process with an expanded subprocess.'
expected_mistakes:
- de: Fehler mit einem normalen Endereignis beendet, ohne Fehler-Randereignis.
  en: Error ended with a none end event, without an error boundary event.
- de: Fehler-Randereignis an einer Aktivität ausserhalb statt am Teilprozess.
  en: Error boundary event attached to an outside activity instead of the subprocess.
- de: Fehlerbehandlung über ein XOR-Gateway nach dem Teilprozess statt über das Randereignis.
  en: Error handled by an XOR gateway after the subprocess instead of the boundary event.
