title:
  de: Störung an einer Seilbahn
  en: Breakdown of a cable car
learning_goal:
  de: Unterbrechende und nicht unterbrechende Zeit-Randereignisse für Fristen einsetzen.
  en: Use interrupting and non-interrupting timer boundary events for time limits.
text:
  de: 'Ein Seilbahnhersteller betreut eine Pendelbahn. Wird eine Störung gemeldet, behebt ein Servicetechniker

    die Störung. Dauert die Behebung länger als 30 Minuten, informiert der Betriebsleiter die Fahrgäste
    über die

    Verzögerung; die Behebung läuft dabei weiter. Ist die Störung nach 2 Stunden nicht behoben, wird die
    Behebung

    abgebrochen und der Betriebsleiter leitet die Bergung der Fahrgäste ein. Wird die Störung rechtzeitig
    behoben, nimmt

    der Techniker die Anlage wieder in Betrieb. Modellieren Sie den Ablauf.'
  en: 'A cable car manufacturer services an aerial tramway. When a breakdown is reported, a service technician

    fixes the breakdown. If fixing takes longer than 30 minutes, the operations manager informs the passengers
    about the

    delay; the repair continues. If the breakdown has not been fixed after 2 hours, the repair is stopped
    and the

    operations manager starts the rescue of the passengers. If the breakdown is fixed in time, the technician
    puts the

    tramway back into operation. Model the process.'
expected_mistakes:
- de: '30-Minuten-Ereignis unterbrechend: die Behebung würde abgebrochen.'
  en: '30-minute event interrupting: the repair would be stopped.'
- de: '2-Stunden-Ereignis nicht unterbrechend: Bergung und Behebung liefen gleichzeitig weiter.'
  en: '2-hour event non-interrupting: rescue and repair would run on together.'
- de: Fristen als Zeit-Zwischenereignisse nach der Aktivität.
  en: Time limits as timer intermediate events after the activity.
