title:
  de: Betonfertigteile herstellen
  en: Producing precast concrete elements
learning_goal:
  de: Wartezeiten als Zeit-Zwischenereignisse mit der Zeitregel als Beschriftung modellieren.
  en: Model waiting times as timer intermediate events labelled with the time rule.
text:
  de: 'Ein Betonwerk stellt Treppenelemente her. Sobald die Schalung bereit ist,

    giesst ein Mitarbeiter den Beton. Danach muss der Beton 24 Stunden in der Schalung aushärten.

    Anschliessend schalt der Mitarbeiter das Element aus und vermisst es. Das Element wird dann auf dem

    Lagerplatz gelagert. Nach 7 Tagen gibt die Qualitätssicherung das Element für die Auslieferung frei.

    Der Ablauf endet, wenn das Element auslieferbereit ist. Modellieren Sie den Ablauf.'
  en: 'A precast concrete plant produces staircase elements. As soon as the formwork is

    ready, an employee pours the concrete. The concrete then has to cure in the formwork for 24 hours.

    After that the employee strips the formwork and measures the element. The element is then stored in
    the

    yard. After 7 days quality assurance releases the element for delivery.

    The process ends when the element is ready for delivery. Model the process.'
expected_mistakes:
- de: Wartezeit als Aktivität ("Beton aushärten lassen") statt als Zeit-Zwischenereignis.
  en: Waiting time modelled as an activity instead of a timer intermediate event.
- de: Zeitereignis ohne Dauer beschriftet.
  en: Timer event labelled without the duration.
- de: Zeit-Startereignis statt normalem Startereignis verwendet.
  en: Timer start event used instead of a none start event.
