skills: error vs escalation, undo completed work, all-or-nothing transactions
title:
  de: Sonderventil fertigen
  en: Manufacturing a special valve
learning_goal:
  de: Eskalation (Weiterarbeiten mit Meldung) und Fehler (Abbruch) unterscheiden.
  en: Tell an escalation (continue and notify) from an error (abort).
text:
  de: 'Ein Hersteller von Industrieventilen fertigt Sonderventile nach Kundenauftrag. Nach der Freigabe
    des

    Auftrags fertigt die Werkstatt das Ventil im Teilprozess "Sonderventil fertigen": Sie bearbeitet das
    Ventil. Ist danach

    der Liefertermin gefährdet, meldet sie den Terminverzug; die Fertigung läuft trotzdem weiter, und
    der Verkauf

    informiert den Kunden über den Verzug. Danach führt die Werkstatt die Druckprüfung durch. Ist das
    Ventil undicht,

    endet der Teilprozess mit dem Fehler "Ventil undicht", und die Arbeitsvorbereitung plant die Fertigung
    neu.

    Besteht das Ventil die Prüfung, liefert der Versand es aus. Modellieren Sie den Ablauf.'
  en: 'An industrial valve manufacturer makes special valves to customer order. After the order has been

    released, the workshop manufactures the valve in the subprocess "Manufacture special valve": it machines
    the valve.

    If the delivery date is then at risk, it reports the delay; manufacturing continues anyway, and sales
    informs the

    customer about the delay. The workshop then carries out the pressure test. If the valve leaks, the
    subprocess ends

    with the error "Valve leaks", and production planning replans the manufacturing. If the valve passes
    the test,

    shipping delivers it. Model the process.'
expected_mistakes:
- de: 'Terminverzug als Fehler: die Fertigung würde abgebrochen.'
  en: 'Delay as an error: manufacturing would be aborted.'
- de: Eskalations-Randereignis unterbrechend.
  en: Escalation boundary event interrupting.
- de: 'Undichtes Ventil als Eskalation: die Auslieferung würde trotzdem erfolgen.'
  en: 'Leaking valve as an escalation: the valve would still be delivered.'
