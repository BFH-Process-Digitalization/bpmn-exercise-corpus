id: T2-A3
topic: 2
level: advanced
slot: A3
core: false
sector: supply chain
setting: Pharmalogistiker
time_limit_minutes: 15
elements: OR, complex gateway, event-based gateway (racing, first event wins), parallel event-based gateway,
  default flow, conditional flow
skills: synchronisation, avoid deadlocks and missing synchronisation, choose the matching join
title:
  de: Kühlkettensendung abwickeln
  en: Handling a cold chain shipment
learning_goal:
  de: Parallele Arbeiten synchronisieren und bedingte Flüsse mit einem Standardfluss aus einer Aktivität
    modellieren.
  en: Synchronise parallel work and model conditional flows with a default flow out of an activity.
text:
  de: 'Ein Pharmalogistiker transportiert temperaturempfindliche Medikamente. Ist eine Kühlsendung angemeldet,

    aktiviert das Lager den Temperaturlogger und gleichzeitig erstellt die Zollabteilung die Zolldokumente.
    Erst wenn

    beides erledigt ist, transportiert der Fahrer die Sendung. Am Ziel prüft die Qualitätssicherung den
    Temperaturverlauf.

    Wurde eine Abweichung festgestellt, informiert sie den Auftraggeber über die Abweichung; andernfalls
    gibt sie die

    Sendung frei. Modellieren Sie den Ablauf. Die Entscheidung nach der Prüfung soll als bedingter Fluss
    mit Standardfluss

    direkt aus der Prüfaktivität modelliert werden.'
  en: 'A pharmaceutical logistics company transports temperature-sensitive medicines. When a cold shipment
    has

    been registered, the warehouse activates the temperature logger and at the same time the customs department
    prepares

    the customs documents. Only when both are done does the driver transport the shipment. At the destination,
    quality

    assurance checks the temperature log. If a deviation was found, it informs the client about the deviation;
    otherwise

    it releases the shipment. Model the process. Model the decision after the check as a conditional flow
    with a default

    flow directly out of the check activity.'
expected_mistakes:
- de: Transport startet nach nur einer der beiden Vorbereitungen (XOR-Join statt AND-Join).
  en: Transport starts after only one of the two preparations (XOR join instead of AND join).
- de: 'Bedingter Fluss ohne Standardfluss: ohne Abweichung bliebe der Ablauf stehen.'
  en: 'Conditional flow without a default flow: without a deviation the process would stop.'
- de: Beide Ausgänge der Prüfung als bedingte Flüsse mit sich überschneidenden Bedingungen.
  en: Both outputs of the check as conditional flows with overlapping conditions.
