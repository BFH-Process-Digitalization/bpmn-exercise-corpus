sector: services
setting: Velowerkstatt
time_limit_minutes: 15
elements: start and end event, task, XOR, AND
skills: read a case text and model control flow
title:
  de: 'Vortest: Veloservice'
  en: 'Pre-test: bicycle service'
learning_goal:
  de: Kenntnisse zu Aktivitäten, Ereignissen, XOR und AND vor dem Kurs erheben.
  en: Measure knowledge of activities, events, XOR and AND before the course.
text:
  de: 'Eine Velowerkstatt bietet einen Jahresservice an. Der Ablauf beginnt, wenn ein Kunde sein Velo

    abgegeben hat. Die Mechanikerin prüft das Velo. Sind Teile verschlissen, ersetzt sie die verschlissenen
    Teile;

    sonst entfällt dieser Schritt. Danach reinigt die Mechanikerin das Velo, während der Empfang gleichzeitig
    die

    Rechnung vorbereitet. Sind beide Arbeiten erledigt, benachrichtigt der Empfang den Kunden. Der Ablauf
    endet,

    wenn das Velo abholbereit ist. Modellieren Sie den Ablauf. Rollen müssen nicht dargestellt werden.'
  en: 'A bicycle workshop offers an annual service. The process starts when a customer has dropped off

    his bicycle. The mechanic inspects the bicycle. If parts are worn, she replaces the worn parts; otherwise
    this

    step is skipped. The mechanic then cleans the bicycle while reception prepares the invoice at the
    same time.

    When both are done, reception notifies the customer. The process ends when the bicycle is ready for

    collection. Model the process. Roles do not need to be shown.'
expected_mistakes:
- de: XOR-Pfad ohne Aktivität fehlt ("sonst entfällt dieser Schritt").
  en: XOR path without an activity missing ("otherwise this step is skipped").
- de: Reinigen und Rechnung hintereinander statt parallel.
  en: Cleaning and invoice in sequence instead of in parallel.
- de: AND-Join fehlt vor dem Benachrichtigen.
  en: AND join missing before notifying.
