id: EA-Q4-5
level: advanced
question: Q4
variant: 5
points: 12
time_minutes: 20
sector: machinery
title:
  de: Getriebe revidieren
  en: Overhauling a gearbox
text:
  de: |-
    Ein Hersteller von Industriegetrieben revidiert Getriebe seiner Kundschaft. Ist ein Revisionsauftrag freigegeben,
    revidiert die Werkstatt das Getriebe: Sie zerlegt das Getriebe und prüft danach die Zahnräder. Ist das Gehäuse
    unbeschädigt, ist das Getriebe revidiert. Andernfalls ist das Gehäuse gerissen, und die Revision bricht ab; der Verkauf
    bietet dann ein Neugetriebe an. Dauert die Revision länger als 5 Tage, informiert der Verkauf den Kunden über die
    Verzögerung; die Revision läuft dabei weiter. Nach erfolgreicher Revision sendet der Versand das Getriebe zurück.
    Modellieren Sie die Revision als aufgeklappten Teilprozess.
  en: |-
    A manufacturer of industrial gearboxes overhauls its customers' gearboxes. When an overhaul order has been released, the
    workshop overhauls the gearbox: it dismantles the gearbox and then inspects the gear wheels. If the housing is
    undamaged, the gearbox is overhauled. Otherwise the housing is cracked and the overhaul is aborted; sales then offers a
    new gearbox. If the overhaul takes longer than 5 days, sales informs the customer about the delay; the overhaul
    continues. After a successful overhaul, shipping returns the gearbox. Model the overhaul as an expanded subprocess.
rubric:
- points: 2
  de: Aufgeklappter Teilprozess «Getriebe revidieren» mit Start, «Getriebe zerlegen», «Zahnräder prüfen» und Ende
  en: Expanded subprocess "Overhaul gearbox" with start, "Dismantle gearbox", "Inspect gear wheels" and end
- points: 1
  de: XOR-Split mit Frage «Gehäuse unbeschädigt?» und Ausgängen ja/nein
  en: XOR split with question "Housing undamaged?" and yes/no flows
- points: 2
  de: Fehler-Endereignis «Gehäuse gerissen» im Teilprozess
  en: Error end event "Housing cracked" inside the subprocess
- points: 2
  de: Fehler-Randereignis am Rand des Teilprozesses mit demselben Fehler
  en: Error boundary event on the subprocess border catching the same error
- points: 1
  de: Fehlerbehandlung «Neugetriebe anbieten» mit eigenem Endereignis
  en: Error handling "Offer new gearbox" with its own end event
- points: 2
  de: Nicht unterbrechendes Zeit-Randereignis «5 Tage» (gestrichelt)
  en: Non-interrupting timer boundary event "5 days" (dashed)
- points: 1
  de: Paralleler Pfad «Kunden über Verzögerung informieren» mit eigenem Endereignis
  en: Parallel path "Inform customer about delay" with its own end event
- points: 1
  de: 'Normaler Ablauf nach dem Teilprozess: «Getriebe zurücksenden»'
  en: 'Normal flow after the subprocess: "Return gearbox"'
