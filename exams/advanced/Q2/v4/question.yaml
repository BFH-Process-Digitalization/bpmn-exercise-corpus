id: EA-Q2-4
level: advanced
question: Q2
variant: 4
points: 8
time_minutes: 12
sector: health
title:
  de: Austritt aus dem Spital
  en: Hospital discharge
text:
  de: |-
    Ein Spital bereitet den Austritt von Patientinnen vor. Ist ein Austritt geplant, richtet die Pflege jedes
    Austrittsmedikament; mehrere Pflegefachpersonen richten die Medikamente gleichzeitig. Danach entscheidet die
    Stationsärztin, welche Nachbetreuung nötig ist: Pflege zu Hause, Physiotherapie, oder beides. Sie meldet die Pflege zu
    Hause an beziehungsweise verordnet die Physiotherapie. Ist die Nachbetreuung organisiert, schreibt sie den
    Austrittsbericht. Ist der Bericht nach 24 Stunden noch nicht fertig, informiert sie die Hausärztin vorab; das Schreiben
    geht weiter. Danach sendet sie den Austrittsbericht. Trifft die Lesebestätigung der Hausärztin ein, schliesst das
    Sekretariat den Fall ab. Trifft innerhalb von 3 Tagen keine Bestätigung ein, übermittelt das Sekretariat den Bericht
    telefonisch.
  en: |-
    A hospital prepares the discharge of patients. When a discharge has been planned, nursing prepares every discharge
    medication; several nurses prepare the medications at the same time. The ward doctor then decides which aftercare is
    needed: home care, physiotherapy, or both. She registers the patient for home care or prescribes physiotherapy
    respectively. When the aftercare is organised, she writes the discharge report. If the report is not finished after
    24 hours, she informs the general practitioner in advance; writing continues. She then sends the discharge report. If
    the general practitioner's read confirmation arrives, the office closes the case. If no confirmation arrives within
    3 days, the office passes on the report by phone.
task:
  de: Das Modell enthält genau vier Fehler gegenüber dem Text und den Modellierungsregeln. Markieren Sie jeden Fehler, benennen Sie ihn und korrigieren Sie ihn.
  en: The model contains exactly four errors with respect to the text and the modelling rules. Mark each error, name it and correct it.
model:
  de: model.de.bpmn
  en: model.en.bpmn
faults:
- points: 2
  de: «Medikament richten» hat einen Schleifenmarker; laut Text laufen die Durchgänge gleichzeitig.
  en: '"Prepare medication" has a loop marker; according to the text the instances run at the same time.'
  fix_de: Marker für parallele Mehrfachinstanz (drei senkrechte Striche).
  fix_en: Parallel multi-instance marker (three vertical bars).
- points: 2
  de: Das OR-Split wird mit einem AND-Join geschlossen; wird nur ein Pfad aktiviert, wartet der Join ewig (Deadlock).
  en: The OR split is closed with an AND join; if only one path is activated, the join waits forever (deadlock).
  fix_de: OR-Join verwenden.
  fix_en: Use an OR join.
- points: 2
  de: Das Zeit-Randereignis «24 Stunden» ist unterbrechend; laut Text läuft «Austrittsbericht schreiben» weiter.
  en: The timer boundary event "24 hours" is interrupting; according to the text "Write discharge report" continues.
  fix_de: Nicht unterbrechendes Zeit-Randereignis (gestrichelter Rand).
  fix_en: Non-interrupting timer boundary event (dashed border).
- points: 2
  de: Nach dem ereignisbasierten Gateway folgt die Aktivität «3 Tage warten»; dort sind nur eintretende Ereignisse oder Empfangsaufgaben erlaubt.
  en: The event-based gateway is followed by the activity "Wait 3 days"; only catching events or receive tasks are allowed there.
  fix_de: Zeit-Zwischenereignis «3 Tage».
  fix_en: Intermediate timer event "3 days".
scoring:
  de: Pro Fehler 1 Punkt für das Erkennen und Benennen, 1 Punkt für die richtige Korrektur.
  en: Per error 1 point for finding and naming it, 1 point for the correct fix.
