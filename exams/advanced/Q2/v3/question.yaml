id: EA-Q2-3
level: advanced
question: Q2
variant: 3
points: 8
time_minutes: 12
sector: supply chain
title:
  de: Kühltransport für Medikamente
  en: Refrigerated transport of medicines
text:
  de: |-
    Ein Logistikdienstleister transportiert Medikamente in Kühlboxen. Ist ein Kühltransport bestellt, bereitet das Lager jede
    Kühlbox der Sendung vor; mehrere Mitarbeitende bereiten die Kühlboxen gleichzeitig vor. Danach entscheidet die
    Versandabteilung, welche Dokumente nötig sind: Ausfuhrpapiere, eine Gefahrgutdeklaration, oder beides. Sind alle nötigen
    Dokumente erstellt, verlädt das Lager die Sendung. Dauert das Verladen länger als 2 Stunden, prüft die
    Qualitätssicherung die Temperaturaufzeichnung; das Verladen läuft dabei weiter. Danach sendet die Versandabteilung das
    Versandavis an den Empfänger. Trifft die Empfangsbestätigung ein, schliesst sie die Sendung ab. Trifft innerhalb von
    48 Stunden keine Bestätigung ein, löst sie eine Nachforschung aus.
  en: |-
    A logistics service provider transports medicines in cool boxes. When a refrigerated transport has been ordered, the
    warehouse prepares every cool box of the shipment; several employees prepare the boxes at the same time. The shipping
    department then decides which documents are needed: export documents, a dangerous goods declaration, or both. When all
    required documents have been created, the warehouse loads the shipment. If loading takes longer than 2 hours, quality
    assurance checks the temperature record; loading continues. The shipping department then sends the dispatch advice to
    the consignee. If the delivery confirmation arrives, it closes the shipment. If no confirmation arrives within 48 hours,
    it starts a trace.
task:
  de: Das Modell enthält genau vier Fehler gegenüber dem Text und den Modellierungsregeln. Markieren Sie jeden Fehler, benennen Sie ihn und korrigieren Sie ihn.
  en: The model contains exactly four errors with respect to the text and the modelling rules. Mark each error, name it and correct it.
model:
  de: model.de.bpmn
  en: model.en.bpmn
faults:
- points: 2
  de: «Kühlbox vorbereiten» hat einen Schleifenmarker; laut Text laufen die Durchgänge gleichzeitig.
  en: '"Prepare cool box" has a loop marker; according to the text the instances run at the same time.'
  fix_de: Marker für parallele Mehrfachinstanz (drei senkrechte Striche).
  fix_en: Parallel multi-instance marker (three vertical bars).
- points: 2
  de: Das OR-Split wird mit einem AND-Join geschlossen; wird nur ein Pfad aktiviert, wartet der Join ewig (Deadlock).
  en: The OR split is closed with an AND join; if only one path is activated, the join waits forever (deadlock).
  fix_de: OR-Join verwenden.
  fix_en: Use an OR join.
- points: 2
  de: Das Zeit-Randereignis «2 Stunden» ist unterbrechend; laut Text läuft «Sendung verladen» weiter.
  en: The timer boundary event "2 hours" is interrupting; according to the text "Load shipment" continues.
  fix_de: Nicht unterbrechendes Zeit-Randereignis (gestrichelter Rand).
  fix_en: Non-interrupting timer boundary event (dashed border).
- points: 2
  de: Nach dem ereignisbasierten Gateway folgt die Aktivität «48 Stunden warten»; dort sind nur eintretende Ereignisse oder Empfangsaufgaben erlaubt.
  en: The event-based gateway is followed by the activity "Wait 48 hours"; only catching events or receive tasks are allowed there.
  fix_de: Zeit-Zwischenereignis «48 Stunden».
  fix_en: Intermediate timer event "48 hours".
scoring:
  de: Pro Fehler 1 Punkt für das Erkennen und Benennen, 1 Punkt für die richtige Korrektur.
  en: Per error 1 point for finding and naming it, 1 point for the correct fix.
solution:
  de: solution.de.bpmn
  en: solution.en.bpmn
