id: EA-Q2-1
level: advanced
question: Q2
variant: 1
points: 8
time_minutes: 12
sector: machinery
title:
  de: Inbetriebnahme einer Abfüllanlage
  en: Commissioning a filling line
text:
  de: |-
    Ein Hersteller von Abfüllanlagen nimmt Anlagen bei der Kundschaft in Betrieb. Ist eine Anlage montiert, prüft das
    Inbetriebnahmeteam jedes Modul der Anlage; die Prüfungen der Module laufen gleichzeitig. Danach entscheidet die
    Projektleitung, welche Anpassungen nötig sind: Die Steuerung wird nachjustiert, die Formatteile werden getauscht, oder
    beides. Sind alle nötigen Anpassungen erledigt, führt das Team den Probelauf durch. Dauert der Probelauf länger als
    4 Stunden, informiert die Projektleitung die Kundschaft über die Verzögerung; der Probelauf läuft dabei weiter. Nach dem
    Probelauf sendet die Projektleitung das Abnahmeprotokoll. Trifft die unterschriebene Abnahme ein, stellt die Buchhaltung
    die Schlussrechnung, und die Anlage ist abgenommen. Trifft innerhalb von 5 Tagen keine Abnahme ein, fragt die
    Projektleitung telefonisch nach.
  en: |-
    A manufacturer of filling lines commissions lines at the customer's site. When a line has been installed, the
    commissioning team tests every module of the line; the module tests run at the same time. The project manager then
    decides which adjustments are needed: the control system is readjusted, the format parts are replaced, or both. When
    all required adjustments are done, the team carries out the trial run. If the trial run takes longer than 4 hours, the
    project manager informs the customer about the delay; the trial run continues. After the trial run the project manager
    sends the acceptance report. If the signed acceptance arrives, accounting issues the final invoice and the line is
    accepted. If no acceptance arrives within 5 days, the project manager follows up by phone.
task:
  de: Das Modell enthält genau vier Fehler gegenüber dem Text und den Modellierungsregeln. Markieren Sie jeden Fehler, benennen Sie ihn und korrigieren Sie ihn.
  en: The model contains exactly four errors with respect to the text and the modelling rules. Mark each error, name it and correct it.
model:
  de: model.de.bpmn
  en: model.en.bpmn
faults:
- points: 2
  de: «Modul prüfen» hat einen Schleifenmarker; laut Text laufen die Durchgänge gleichzeitig.
  en: '"Test module" has a loop marker; according to the text the instances run at the same time.'
  fix_de: Marker für parallele Mehrfachinstanz (drei senkrechte Striche).
  fix_en: Parallel multi-instance marker (three vertical bars).
- points: 2
  de: Das OR-Split wird mit einem AND-Join geschlossen; wird nur ein Pfad aktiviert, wartet der Join ewig (Deadlock).
  en: The OR split is closed with an AND join; if only one path is activated, the join waits forever (deadlock).
  fix_de: OR-Join verwenden.
  fix_en: Use an OR join.
- points: 2
  de: Das Zeit-Randereignis «4 Stunden» ist unterbrechend; laut Text läuft «Probelauf durchführen» weiter.
  en: The timer boundary event "4 hours" is interrupting; according to the text "Carry out trial run" continues.
  fix_de: Nicht unterbrechendes Zeit-Randereignis (gestrichelter Rand).
  fix_en: Non-interrupting timer boundary event (dashed border).
- points: 2
  de: Nach dem ereignisbasierten Gateway folgt die Aktivität «5 Tage warten»; dort sind nur eintretende Ereignisse oder Empfangsaufgaben erlaubt.
  en: The event-based gateway is followed by the activity "Wait 5 days"; only catching events or receive tasks are allowed there.
  fix_de: Zeit-Zwischenereignis «5 Tage».
  fix_en: Intermediate timer event "5 days".
scoring:
  de: Pro Fehler 1 Punkt für das Erkennen und Benennen, 1 Punkt für die richtige Korrektur.
  en: Per error 1 point for finding and naming it, 1 point for the correct fix.
solution:
  de: solution.de.bpmn
  en: solution.en.bpmn
