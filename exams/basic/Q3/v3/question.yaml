  de: Startereignis als Zustand benannt
  en: Start event named as a state
- points: 1
  de: Endereignis als Ergebnis benannt
  en: End event named as the result
- points: 1
  de: Alle Aktivitäten als Objekt und Verb benannt
  en: All activities named as verb and object
- points: 2
  de: XOR-Split mit Frage «Beschau angeordnet?» und Ausgängen ja/nein
  en: XOR split with question "Inspection ordered?" and yes/no flows
- points: 1
  de: XOR-Merge vor dem weiteren Ablauf
  en: XOR merge before the process continues
- points: 2
  de: Nachrichten-Zwischenereignis (eintretend) «Zollfreigabe erhalten» an der richtigen Stelle
  en: Intermediate message catch event "Customs release received" at the right place
- points: 2
  de: AND-Split und AND-Join um die beiden gleichzeitigen Arbeiten
  en: AND split and AND join around the two concurrent tasks
- points: 2
  de: Reihenfolge aller Schritte wie im Text
  en: Order of all steps as in the text
